# Gemeinsame Prüfungen, aufgerufen von pr.yml, main.yml und release.yml
name: Checks

on:
  workflow_call:

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # check = Unit-, Architektur- und Robolectric-Tests, Android Lint, ktlint
      - name: Bauen und prüfen
        run: ./gradlew assembleDebug check createDebugUnitTestCoverageReport --continue

      - uses: reviewdog/action-setup@v1
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}

      - name: Lint- und ktlint am PR kommentieren
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in app/build/reports/ktlint/*Check/*.xml; do
            [ -f "$f" ] && reviewdog -f=checkstyle -name=ktlint \
              -reporter=github-pr-review -fail-level=none < "$f"
          done
          f=app/build/reports/lint-results-debug.sarif
          [ -f "$f" ] && reviewdog -f=sarif -name=android-lint \
            -reporter=github-pr-review -fail-level=none < "$f"
          true

      - name: Testergebnisse am PR kommentieren
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Testergebnisse
          report_paths: app/build/test-results/**/*.xml
          comment: true
          include_passed: false

      - name: Testabdeckung am PR kommentieren
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('app/build/reports/coverage/test/debug/report.xml') != '' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: app/build/reports/coverage/test/debug/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Testabdeckung
          update-comment: true

      - name: Berichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: berichte
          path: app/build/reports/

      - name: Debug-APK hochladen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: radio-app-debug
          path: app/build/outputs/apk/debug/*.apk

