# Gemeinsame Prüfungen, aufgerufen von pr.yml, main.yml und release.yml.
# Lint und Build & Test laufen parallel, zusammen entsprechen sie ./gradlew check.
name: Checks

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # Schlägt nur bei Befunden der Schwere Error fehl, Warnungen stehen im Bericht
      - name: Android Lint ausführen
        run: ./gradlew lintDebug

      - name: Lint-Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-bericht
          path: app/build/reports/lint-results-debug.html

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # Unit-, Architektur- und Robolectric-Tests
      - name: build & test
        run: ./gradlew assembleDebug testDebugUnitTest createDebugUnitTestCoverageReport --continue

      # Ein Kommentar pro PR, wird bei jedem Push aktualisiert
      - name: Testergebnisse im PR kommentieren
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: mikepenz/action-junit-report@v6
        with:
          annotate_only: true
          comment: true
          report_paths: app/build/test-results/**/*.xml
          include_passed: false

      - name: Testabdeckung in der Zusammenfassung melden
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('app/build/reports/coverage/test/debug/report.xml') != '' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: app/build/reports/coverage/test/debug/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Testabdeckung
          comment-type: summary

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-berichte
          path: app/build/reports/tests/

      - name: Debug-APK hochladen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: radio-app-debug
          path: app/build/outputs/apk/debug/*.apk
