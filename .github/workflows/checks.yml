# Gemeinsame Prüfungen, aufgerufen von pr.yml, main.yml und release.yml.
# Lint und Build & Test laufen parallel, zusammen entsprechen sie ./gradlew check.
name: Checks

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # Android Lint (Android-Regeln) und ktlint (Kotlin-Stil)
      - name: Lint und ktlint ausführen
        run: ./gradlew lintDebug ktlintCheck --continue

      - uses: reviewdog/action-setup@v1
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}

      # Befunde als Annotationen an diesem Job, nur für geänderte Zeilen
      - name: Befunde an den Zeilen anzeigen
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in app/build/reports/ktlint/*Check/*.xml; do
            [ -f "$f" ] && reviewdog -f=checkstyle -name=ktlint \
              -reporter=github-pr-annotations -fail-level=none < "$f"
          done
          f=app/build/reports/lint-results-debug.sarif
          [ -f "$f" ] && reviewdog -f=sarif -name=android-lint \
            -reporter=github-pr-annotations -fail-level=none < "$f"
          true

      - name: Berichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-berichte
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/ktlint/

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # Unit-, Architektur- und Robolectric-Tests
      - name: Bauen und testen
        run: ./gradlew assembleDebug testDebugUnitTest createDebugUnitTestCoverageReport --continue

      - name: Testergebnisse in der Zusammenfassung melden
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: mikepenz/action-junit-report@v6
        with:
          annotate_only: true
          report_paths: app/build/test-results/**/*.xml
          include_passed: false

      - name: Testabdeckung in der Zusammenfassung melden
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('app/build/reports/coverage/test/debug/report.xml') != '' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: app/build/reports/coverage/test/debug/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Testabdeckung
          comment-type: summary

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-berichte
          path: app/build/reports/tests/

      - name: Debug-APK hochladen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: radio-app-debug
          path: app/build/outputs/apk/debug/*.apk
